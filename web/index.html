<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Chess Engine - Modern Web Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon">♔</span>
            <div class="logo-text">
                <h1>C CHESS ENGINE</h1>
                <span class="version-tag">Native Bitboard Edition</span>
            </div>
        </div>

        <div class="engine-status">
            <span class="status-indicator online" id="statusDot"></span>
            <span id="statusText">Connected to Native C Engine</span>
        </div>
    </header>

    <!-- Main Application Container -->
    <main class="game-container">
        
        <!-- Left: Evaluation Meter -->
        <div class="eval-panel">
            <div class="eval-bar-container">
                <div class="eval-bar-fill" id="evalFill"></div>
            </div>
            <div class="eval-score-badge" id="evalBadge">+0.0</div>
        </div>

        <!-- Center: Chessboard Container -->
        <div class="board-wrapper">
            <!-- Top Player Card (Black) -->
            <div class="player-card" id="topPlayerCard">
                <div class="player-info">
                    <div class="player-avatar black-avatar">♚</div>
                    <div class="player-details">
                        <span class="player-name" id="topPlayerName">C Engine (Black)</span>
                        <div class="captured-pieces" id="topCaptured"></div>
                    </div>
                </div>
                <div class="player-timer" id="topTimer">05:00</div>
            </div>

            <!-- The 8x8 Board Grid -->
            <div class="chessboard-container">
                <div id="chessboard" class="chessboard"></div>
            </div>

            <!-- Bottom Player Card (White) -->
            <div class="player-card" id="bottomPlayerCard">
                <div class="player-info">
                    <div class="player-avatar white-avatar">♔</div>
                    <div class="player-details">
                        <span class="player-name" id="bottomPlayerName">Player (White)</span>
                        <div class="captured-pieces" id="bottomCaptured"></div>
                    </div>
                </div>
                <div class="player-timer active" id="bottomTimer">05:00</div>
            </div>
        </div>

        <!-- Right: Controls & History Sidebar -->
        <aside class="sidebar">
            
            <!-- Settings Card -->
            <div class="card settings-card">
                <h3>Game Controls</h3>
                
                <div class="setting-group">
                    <label for="modeSelect">Game Mode</label>
                    <select id="modeSelect" class="custom-select">
                        <option value="human_vs_engine">Human vs C Engine</option>
                        <option value="engine_vs_engine">Engine vs Engine (Self-Play)</option>
                        <option value="human_vs_human">Local 2-Player</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label for="sideSelect">Play As</label>
                    <div class="segmented-control">
                        <button class="segment active" id="btnPlayWhite">White ♔</button>
                        <button class="segment" id="btnPlayBlack">Black ♚</button>
                    </div>
                </div>

                <div class="setting-group">
                    <label for="difficultySelect">Engine Difficulty</label>
                    <select id="difficultySelect" class="custom-select">
                        <option value="2">Easy (Depth 2)</option>
                        <option value="4" selected>Medium (Depth 4)</option>
                        <option value="6">Hard (Depth 6)</option>
                        <option value="8">Master (Depth 8)</option>
                    </select>
                </div>

                <div class="action-buttons">
                    <button class="btn primary-btn" id="btnNewGame">⚡ New Game</button>
                    <button class="btn secondary-btn" id="btnUndo">↩ Undo Move</button>
                    <button class="btn secondary-btn" id="btnHint">💡 Take Hint</button>
                    <button class="btn icon-btn" id="btnFlip" title="Flip Board">🔄</button>
                </div>
            </div>

            <!-- Move History Card -->
            <div class="card history-card">
                <h3>Move History</h3>
                <div class="history-list-container" id="historyContainer">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>White</th>
                                <th>Black</th>
                                <th>Eval</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- Moves added dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- FEN Copy/Paste Card -->
            <div class="card fen-card">
                <h3>FEN Position</h3>
                <div class="fen-input-group">
                    <input type="text" id="fenInput" class="custom-input" readonly>
                    <button class="btn secondary-btn" id="btnCopyFen">Copy</button>
                </div>
            </div>

        </aside>

    </main>

    <!-- Promotion Modal -->
    <div class="modal-overlay" id="promotionModal">
        <div class="modal-card">
            <h3>Choose Promotion Piece</h3>
            <div class="promotion-pieces" id="promotionChoices">
                <!-- Added dynamically -->
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal-overlay" id="gameOverModal">
        <div class="modal-card game-over-card">
            <h2 id="gameOverTitle">Game Over</h2>
            <p id="gameOverReason">Checkmate!</p>
            <button class="btn primary-btn" id="btnModalPlayAgain">Play Again</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
